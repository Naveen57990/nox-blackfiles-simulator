<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NAGAR-BOT // Mobile Rover Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090c10;
      color: #f0f6fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #00d2b4;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-text {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }
    .viewport {
      flex: 1;
      position: relative;
      background: #12161f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, #preview-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .placeholder-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      z-index: 2;
    }
    .camera-icon-big {
      font-size: 48px;
    }
    .hud-overlay {
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px solid rgba(0, 210, 180, 0.3);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      z-index: 3;
    }
    .hud-tag {
      background: rgba(0,0,0,0.85);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #00d2b4;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .footer-bar {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: #00d2b4; color: #04241e; }
    .btn-primary:active { background: #02b399; transform: scale(0.98); }
    .btn-success { background: #10b981; color: #04241e; }
    .btn-success:active { background: #0d9668; transform: scale(0.98); }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #30363d; color: #f0f6fc; }
    .stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    .switch-link {
      background: rgba(0, 210, 180, 0.1);
      border: 1px dashed #00d2b4;
      color: #00d2b4;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-decoration: none;
      text-align: center;
      display: block;
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="status-dot" id="dot"></span>
      <span>NAGAR-ROVER POV</span>
    </div>
    <span class="status-text" id="status-label">CONNECTING...</span>
  </header>

  <div class="viewport" id="viewport-box">
    <video id="cam-feed" playsinline webkit-playsinline autoplay muted style="display:none;"></video>
    <img id="preview-img" style="display:none;" alt="Camera Snap Preview">
    <canvas id="stream-canvas" style="display:none;"></canvas>
    
    <!-- INITIAL PROMINENT VIEW -->
    <div class="placeholder-view" id="placeholder-box">
      <div class="camera-icon-big">📸</div>
      <h3 style="font-size:16px; color:#f0f6fc;">Live Mobile Streamer</h3>
      <p style="font-size:12px; color:#94a3b8; line-height:1.4;">
        Tap the green button below to snap or start live streaming road frames directly to your laptop dashboard.
      </p>
      <a href="https://10.50.195.37:3443/camera.html" class="switch-link" id="https-btn" style="display:none;">
        🔒 Tap here for Continuous Video (HTTPS)
      </a>
    </div>

    <div class="hud-overlay">
      <div style="display:flex; justify-content:space-between;">
        <span class="hud-tag" id="hud-cam-label">CAM: ENVIRONMENT</span>
        <span class="hud-tag" id="stream-rate">0 FPS</span>
      </div>
      <div>
        <span class="hud-tag" style="color:#f59e0b;">LOCAL EDGE TRANSMISSION</span>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <!-- METHOD 1: NATIVE INSTANT SNAP & STREAM (WORKS 100% ON ALL PHONES & BROWSERS OVER HTTP) -->
    <input type="file" id="native-cam-input" accept="image/*" capture="environment" onchange="handleNativeSnap(event)" style="display:none;">
    <button class="btn btn-success" onclick="document.getElementById('native-cam-input').click()">
      📸 Tap to Take Photo & Stream to Laptop
    </button>

    <!-- METHOD 2: CONTINUOUS WEBRTC STREAM (ON HTTPS OR SUPPORTED BROWSERS) -->
    <button class="btn btn-primary" id="btn-stream" onclick="toggleContinuousStreaming()">
      📹 Start Live Continuous Video Stream
    </button>

    <!-- METHOD 3: TEST PRESET SAMPLE (IF PHYSICAL CAMERA IS UNACCESSIBLE) -->
    <button class="btn btn-outline" style="padding:8px; font-size:12px;" onclick="sendSamplePothole()">
      🧪 Send Test Road Defect Sample
    </button>

    <div class="stats">
      <span id="frames-sent">Frames Sent: 0</span>
      <span id="socket-target">Target: 10.50.195.37</span>
    </div>
  </div>

  <script>
    const isHttps = window.location.protocol === "https:";
    let streamActive = false;
    let ws = null;
    let videoStream = null;
    let streamInterval = null;
    let frameCount = 0;

    const videoEl = document.getElementById('cam-feed');
    const previewImg = document.getElementById('preview-img');
    const canvasEl = document.getElementById('stream-canvas');
    const placeholderBox = document.getElementById('placeholder-box');
    const dotEl = document.getElementById('dot');
    const statusLabel = document.getElementById('status-label');
    const btnStream = document.getElementById('btn-stream');
    const framesSentEl = document.getElementById('frames-sent');
    const streamRateEl = document.getElementById('stream-rate');
    const httpsBtn = document.getElementById('https-btn');

    if (!isHttps && httpsBtn) {
      httpsBtn.style.display = 'block';
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      
      const loc = window.location;
      const wsProto = isHttps ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${loc.host}/ws/camera`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        dotEl.classList.add('connected');
        statusLabel.innerText = "CONNECTED TO LAPTOP ✅";
        statusLabel.style.color = "#10b981";
      };

      ws.onclose = () => {
        dotEl.classList.remove('connected');
        statusLabel.innerText = "DISCONNECTED";
        statusLabel.style.color = "#ef4444";
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (err) => {
        console.warn("WebSocket error:", err);
      };
    }

    // --- 1. INSTANT SNAP HANDLER ---
    function handleNativeSnap(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result;

        // Show image immediately in viewport
        placeholderBox.style.display = 'none';
        videoEl.style.display = 'none';
        previewImg.style.display = 'block';
        previewImg.src = base64;

        sendFrame(base64);
        statusLabel.innerText = "FRAME STREAMED TO LAPTOP ✅";
        statusLabel.style.color = "#10b981";
      };
      reader.readAsDataURL(file);
    }

    function sendFrame(base64) {
      frameCount++;
      framesSentEl.innerText = `Frames Sent: ${frameCount}`;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "ROVER_FRAME",
          image_base64: base64,
          timestamp: new Date().toISOString()
        }));
      } else {
        // Fallback HTTP POST
        fetch('/api/detect/frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image_base64: base64,
            source: "PHONE_LIVE_STREAM"
          })
        }).catch(() => {});
      }
    }

    // --- 2. CONTINUOUS VIDEO STREAM ---
    async function toggleContinuousStreaming() {
      if (!isHttps) {
        // Redirect to HTTPS port
        window.location.href = `https://${window.location.hostname}:3443/camera.html`;
        return;
      }

      if (streamActive) {
        streamActive = false;
        clearInterval(streamInterval);
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
          videoStream = null;
        }
        btnStream.className = "btn btn-primary";
        btnStream.innerText = "📹 Start Live Continuous Video Stream";
        statusLabel.innerText = "PAUSED";
      } else {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 640 },
              height: { ideal: 480 }
            },
            audio: false
          });

          placeholderBox.style.display = 'none';
          previewImg.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.srcObject = videoStream;
          await videoEl.play();

          streamActive = true;
          btnStream.className = "btn btn-stop";
          btnStream.innerText = "⏹️ Stop Live Video Stream";
          statusLabel.innerText = "STREAMING VIDEO LIVE 🟢";
          statusLabel.style.color = "#10b981";

          canvasEl.width = 400;
          canvasEl.height = 300;
          const ctx = canvasEl.getContext('2d');

          streamInterval = setInterval(() => {
            if (videoEl.videoWidth > 0 && streamActive) {
              ctx.drawImage(videoEl, 0, 0, 400, 300);
              const base64 = canvasEl.toDataURL('image/jpeg', 0.55);
              sendFrame(base64);
            }
          }, 600);

        } catch (err) {
          alert("Could not start live continuous video: " + err.message + "\n\nTip: You can use the green 'Tap to Take Photo & Stream' button which works immediately on all phones!");
        }
      }
    }

    // --- 3. SAMPLE TEST ---
    function sendSamplePothole() {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="640" height="480" fill="#22252a"/><ellipse cx="360" cy="270" rx="140" ry="90" fill="#141517"/><text x="30" y="50" font-family="monospace" font-size="18" fill="#00d2b4">PHONE TEST: Severe Pothole</text></svg>`;
      const base64 = `data:image/svg+xml;base64,${btoa(svg)}`;
      
      placeholderBox.style.display = 'none';
      videoEl.style.display = 'none';
      previewImg.style.display = 'block';
      previewImg.src = base64;

      sendFrame(base64);
      statusLabel.innerText = "TEST FRAME SENT TO LAPTOP ✅";
      statusLabel.style.color = "#10b981";
    }

    window.addEventListener('DOMContentLoaded', () => {
      connectWebSocket();
    });
  </script>

</body>
</html>
