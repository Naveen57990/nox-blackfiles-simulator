<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NAGAR-BOT // Mobile Rover Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090c10;
      color: #f0f6fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #00d2b4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-text {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }
    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hud-overlay {
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px solid rgba(0, 210, 180, 0.3);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }
    .hud-tag {
      background: rgba(0,0,0,0.8);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #00d2b4;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .notice-banner {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      padding: 10px 14px;
      font-size: 12px;
      color: #fbbf24;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .notice-banner a {
      color: #00d2b4;
      font-weight: 700;
      text-decoration: underline;
    }
    .footer-bar {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary { background: #00d2b4; color: #04241e; }
    .btn-success { background: #10b981; color: #04241e; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #30363d; color: #f0f6fc; }
    .stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="status-dot" id="dot"></span>
      <span>NAGAR-ROVER POV</span>
    </div>
    <span class="status-text" id="status-label">DISCONNECTED</span>
  </header>

  <!-- HTTP VS HTTPS PERMISSION NOTICE -->
  <div class="notice-banner" id="http-notice" style="display:none;">
    <span>🔒 <b>Continuous Video Stream requires HTTPS:</b></span>
    <a href="https://10.50.195.37:3443/camera.html" id="https-link">👉 Tap here to open HTTPS Streamer (Port 3443)</a>
    <span style="font-size:10px; color:#94a3b8;">(If browser shows security warning, tap Advanced &rarr; Proceed to 10.50.195.37)</span>
  </div>

  <div class="viewport">
    <video id="cam-feed" playsinline autoplay muted style="display:none;"></video>
    <img id="preview-img" style="display:none;" alt="Camera Snap Preview">
    <canvas id="stream-canvas" style="display:none;"></canvas>
    
    <div class="hud-overlay">
      <div style="display:flex; justify-content:space-between;">
        <span class="hud-tag" id="hud-cam-label">CAM: ROVER BACK</span>
        <span class="hud-tag" id="stream-rate">0 FPS</span>
      </div>
      <div>
        <span class="hud-tag" style="color:#f59e0b;">ZERO CLOUD TRANSMISSION</span>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <!-- NATIVE CAMERA SNAP (WORKS ON ANY HTTP/HTTPS BROWSER) -->
    <input type="file" id="native-cam-input" accept="image/*" capture="environment" onchange="handleNativeSnap(event)" style="display:none;">
    <button class="btn btn-success" onclick="document.getElementById('native-cam-input').click()">
      📸 Snap & Stream Road Frame to Laptop
    </button>

    <!-- CONTINUOUS STREAMING BUTTON (ON HTTPS) -->
    <button class="btn btn-primary" id="btn-stream" onclick="toggleContinuousStreaming()">
      📹 Start Continuous Live Video Stream
    </button>

    <div class="stats">
      <span id="frames-sent">Frames Sent: 0</span>
      <span id="socket-target">Target: Laptop Core</span>
    </div>
  </div>

  <script>
    let isHttps = window.location.protocol === "https:";
    let streamActive = false;
    let ws = null;
    let videoStream = null;
    let streamInterval = null;
    let frameCount = 0;

    const videoEl = document.getElementById('cam-feed');
    const previewImg = document.getElementById('preview-img');
    const canvasEl = document.getElementById('stream-canvas');
    const dotEl = document.getElementById('dot');
    const statusLabel = document.getElementById('status-label');
    const btnStream = document.getElementById('btn-stream');
    const framesSentEl = document.getElementById('frames-sent');
    const streamRateEl = document.getElementById('stream-rate');
    const httpNotice = document.getElementById('http-notice');

    // Show HTTPS notice if running on plain HTTP
    if (!isHttps) {
      httpNotice.style.display = 'flex';
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      
      const loc = window.location;
      const wsProto = isHttps ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${loc.host}/ws/camera`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        dotEl.classList.add('connected');
        statusLabel.innerText = "CONNECTED TO LAPTOP";
        statusLabel.style.color = "#10b981";
      };

      ws.onclose = () => {
        dotEl.classList.remove('connected');
        statusLabel.innerText = "DISCONNECTED";
        statusLabel.style.color = "#ef4444";
      };

      ws.onerror = (err) => {
        console.warn("WebSocket error:", err);
      };
    }

    // --- 1. NATIVE CAMERA SNAP (100% WORKS ON ALL MOBILE BROWSERS OVER HTTP) ---
    function handleNativeSnap(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result;
        
        // Show local preview
        videoEl.style.display = 'none';
        previewImg.style.display = 'block';
        previewImg.src = base64;

        // Ensure WebSocket is connected and send
        connectWebSocket();
        
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "ROVER_FRAME",
              image_base64: base64,
              timestamp: new Date().toISOString()
            }));
            frameCount++;
            framesSentEl.innerText = `Frames Sent: ${frameCount}`;
            statusLabel.innerText = "FRAME STREAMED TO LAPTOP ✅";
            statusLabel.style.color = "#10b981";
          } else {
            // Fallback via HTTP POST
            fetch('/api/detect/frame', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                image_base64: base64,
                source: "PHONE_LIVE_STREAM"
              })
            }).then(() => {
              frameCount++;
              framesSentEl.innerText = `Frames Sent: ${frameCount}`;
              statusLabel.innerText = "FRAME STREAMED TO LAPTOP ✅";
            });
          }
        }, 300);
      };
      reader.readAsDataURL(file);
    }

    // --- 2. CONTINUOUS WEBRTC STREAMING (FOR HTTPS) ---
    async function toggleContinuousStreaming() {
      if (!isHttps) {
        window.location.href = "https://10.50.195.37:3443/camera.html";
        return;
      }

      if (streamActive) {
        streamActive = false;
        clearInterval(streamInterval);
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
          videoStream = null;
        }
        btnStream.className = "btn btn-primary";
        btnStream.innerText = "📹 Start Continuous Live Video Stream";
        statusLabel.innerText = "STANDBY";
      } else {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 640 },
              height: { ideal: 480 }
            },
            audio: false
          });

          previewImg.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.srcObject = videoStream;
          await videoEl.play();

          connectWebSocket();
          streamActive = true;
          btnStream.className = "btn btn-stop";
          btnStream.innerText = "⏹️ Stop Continuous Stream";

          canvasEl.width = 640;
          canvasEl.height = 480;
          const ctx = canvasEl.getContext('2d');

          streamInterval = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN && videoEl.videoWidth > 0) {
              ctx.drawImage(videoEl, 0, 0, 640, 480);
              const base64 = canvasEl.toDataURL('image/jpeg', 0.7);

              ws.send(JSON.stringify({
                type: "ROVER_FRAME",
                image_base64: base64,
                timestamp: new Date().toISOString()
              }));

              frameCount++;
              framesSentEl.innerText = `Frames Sent: ${frameCount}`;
            }
          }, 500);

        } catch (err) {
          alert("Camera access error: " + err.message + "\n\nTip: You can use the green 'Snap & Stream' button which works immediately!");
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      connectWebSocket();
    });
  </script>

</body>
</html>
