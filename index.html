<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOX Blackfiles // Workstation</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="js/main.js" defer></script>
</head>
<body>

<div class="shell">
  <!-- Investigation Workstation Panel -->
  <aside class="workstation-panel">
    <div class="case-id-header">
      <h1>NOX-1145</h1>
      <div class="status">Active Investigation</div>
    </div>
    
    <nav class="nav-menu">
      <button class="nav-item active" data-view-target="scene">Scene Report</button>
      <button class="nav-item" data-view-target="evidence">Evidence Vault</button>
      <button class="nav-item" data-view-target="board">Deduction Board</button>
      <button class="nav-item" data-view-target="interrogation">Interrogation</button>
    </nav>
    
    <div style="padding: 20px; border-top: 1px solid var(--border);">
      <div id="status-progress" style="font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-bottom: 10px;">0 / 5 Evidence Found</div>
      <button id="btn-reset" style="background:transparent; border:none; color:var(--muted); font-size:10px; cursor:pointer; text-decoration:underline;">[Wipe Local State]</button>
    </div>
  </aside>

  <!-- Interactive Case Canvas -->
  <main class="workspace-canvas">
    
    <!-- View: Scene Report -->
    <section id="view-scene" class="view-pane">
      <div id="scene-content"></div>
    </section>

    <!-- View: Evidence -->
    <section id="view-evidence" class="view-pane" style="display:none;">
      <div style="margin-bottom: 40px;">
        <h2 style="font-family: var(--font-display); font-size: 32px; margin: 0 0 5px 0;">Evidence Vault</h2>
        <p style="font-family: var(--font-mono); color: var(--muted); font-size: 12px;">Deep inspection required for deduction extraction.</p>
      </div>
      <div id="evidence-grid"></div>
    </section>

    <!-- View: Board -->
    <section id="view-board" class="view-pane" style="display:none; padding: 0;">
      <div style="position: absolute; top: 40px; left: 40px; z-index: 10;">
        <h2 style="font-family: var(--font-display); font-size: 32px; margin: 0 0 5px 0;">Deduction Board</h2>
        <p style="font-family: var(--font-mono); color: var(--muted); font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px;">Link nodes to formulate hypotheses.</p>
      </div>
      <div id="board-canvas">
        <svg id="board-lines"></svg>
      </div>
    </section>

    <!-- View: Interrogation -->
    <section id="view-interrogation" class="view-pane" style="display:none;">
      <div id="interrogation-content"></div>
    </section>

  </main>
</div>

</body>
</html>
